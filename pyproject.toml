[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ROSBagel"
version = "1.6.3"
description = "Windows-first offline ROS 1/2 bag inspection, export, and timeline visualization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Owen ZI-WEN ZHOU" }
]
maintainers = [
  { name = "Owen ZI-WEN ZHOU" }
]
keywords = ["ros", "ros2", "rosbag", "robotics", "export", "inspection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "rosbags>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "opencv-python>=4.8",
  "pillow>=10.0",
  "typer>=0.12",
  "rich>=13.7",
  "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "vispy>=0.14", "PyOpenGL>=3.1"]
dev = ["pytest>=8.0"]

[project.urls]
"Repository" = "https://github.com/Tsubashimo-Nanato/ROSBagel"
"Related Lab Repository" = "https://github.com/Sophia-AI-formula-team/aiformula_sophia"

[project.scripts]
bagel = "rosbagel.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["rosbagel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
